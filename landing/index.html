<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/symbol-transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tu carta natal calculada y explicada, el patrón que se repite en tu dinero, relaciones y decisiones, y una guía diaria en tu portal privado." />
    <title>Abundance Code — La app que lee tu carta natal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="/img/app-hero-chart.png" />

    <!-- Tarjeta al compartir el enlace (WhatsApp, Facebook, X, LinkedIn).
         og:image debe ser URL absoluta: los scrapers no resuelven rutas
         relativas. Cambia el dominio si el sitio se sirve desde otro. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Abundance Code" />
    <meta property="og:url"         content="https://abundancecode.us/" />
    <meta property="og:title"       content="Abundance Code — La app que lee tu carta natal" />
    <meta property="og:description" content="Descubre el patrón que se repite en tu vida. Tu carta natal, calculada y explicada, con guía personal cada día." />
    <meta property="og:image"       content="https://abundancecode.us/img/og-image.jpg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Abundance Code — La app que lee tu carta natal" />
    <meta name="twitter:description" content="Descubre el patrón que se repite en tu vida. Tu carta natal, calculada y explicada, con guía personal cada día." />
    <meta name="twitter:image"       content="https://abundancecode.us/img/og-image.jpg" />

    <!-- Título, descripción, canonical y JSON-LD por ruta: los escribe
         scripts/postbuild-seo.mjs en cada build y los mantiene src/seo/Seo.jsx
         al navegar. Lo de arriba es el valor por defecto en desarrollo. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
